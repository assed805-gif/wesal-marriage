<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وصال — لوحة الإدارة</title><style>body{margin:0;font-family:Tahoma,Arial;background:linear-gradient(125deg,#53061d,#a51d42);min-height:100vh;color:#441226}main{max-width:950px;margin:30px auto;background:#fff9f6;padding:24px;border-radius:22px;box-shadow:0 10px 55px #0003}h1{color:#911a3d}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #caa9ac}input{display:block;width:100%;max-width:430px;margin:10px 0}button{cursor:pointer;background:#8e1637;color:white;border:0;margin:6px}article{background:white;border:1px solid #eed5d6;padding:15px;border-radius:14px;margin:12px 0;overflow-wrap:anywhere}small{color:#735960}#app{display:none}.error{color:#ad113c}</style></head><body><main><h1>💍 وصال — إدارة الطلبات</h1><p>لوحة الإدارة الخاصة. تتطلب تفعيل وظائف الخادم ومتغيرات البيئة والاختبار الأمني أولًا.</p><section id="login"><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username"><input id="password" type="password" placeholder="كلمة مرور الإدارة" autocomplete="current-password"><button id="enter">دخول</button></section><section id="app"><button id="refresh">تحديث الطلبات</button><div id="rows"></div></section><p id="message" role="status"></p></main><script>
const $=x=>document.getElementById(x);const msg=t=>$('message').textContent=t;
$('enter').onclick=async()=>{msg('جارٍ التحقق...');try{const r=await fetch('/.netlify/functions/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});if(!r.ok)throw Error('تعذر الدخول. تحقق من إعداد الخادم وبيانات الدخول.');$('password').value='';$('login').style.display='none';$('app').style.display='block';await load()}catch(e){msg(e.message)}};
async function load(){msg('تحميل الطلبات...');try{const r=await fetch('/.netlify/functions/admin-list',{cache:'no-store'});if(!r.ok)throw Error('تعذر جلب الطلبات');const {rows}=await r.json();$('rows').replaceChildren();for(const x of rows){const box=document.createElement('article'),heading=document.createElement('h3');heading.textContent=x.reference_code+' — '+x.full_name;box.appendChild(heading);const p=document.createElement('p');p.textContent=`${x.applicant_type} | العمر: ${x.age_years} | ${x.residence_country} — ${x.region} | ${x.status}`;box.appendChild(p);const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='عرض التفاصيل الخاصة';details.appendChild(summary);const pre=document.createElement('pre');pre.style.whiteSpace='pre-wrap';pre.textContent=JSON.stringify({phone:x.phone,occupation:x.occupation,preferences:x.preferred_partner,area:x.city,marital_status:x.marital_status},null,2);details.appendChild(pre);box.appendChild(details);const sel=document.createElement('select');for(const s of ['awaiting_payment','payment_review','active_search','matched','closed','rejected'])sel.add(new Option(s,s));sel.value=x.status;box.appendChild(sel);const btn=document.createElement('button');btn.textContent='حفظ الحالة';btn.onclick=async()=>{btn.disabled=true;try{const r=await fetch('/.netlify/functions/admin-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:x.id,status:sel.value})});if(!r.ok)throw Error();msg('تم تحديث الحالة');await load()}catch(_){msg('تعذر تحديث الحالة')}finally{btn.disabled=false}};box.appendChild(btn);$('rows').appendChild(box)}msg('عدد الطلبات المعروضة: '+rows.length)}catch(e){msg(e.message)}}$('refresh').onclick=load;
</script></body></html>
